# AU9922 / Baota Nginx 补充配置
#
# 宝塔「网站 → 设置 → 配置文件」中：
# 1) 确认 server { } 内有 index index.php index.html;
# 2) 把 location / { ... } 的 try_files 改成下面这一行；
# 3) 保存后重载 Nginx。
#
# 不需要为 /api/ 单独写 rewrite：/api/* 由 index.php 交给 api.php。
# /data/orders.php 和 /config.php 由 PHP 自身返回 403，不依赖 Nginx deny。

client_max_body_size 10m;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}
